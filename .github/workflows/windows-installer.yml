name: Windows tray installer

on:
  push:
    branches: [main]
    paths:
      - "apps/windows-host/**"
      - "apps/recovery-watch/**"
      - "apps/bridge/**"
      - "apps/web/**"
      - "apps/a320-wasm/**"
      - "scripts/package-a320-wasm.py"
      - ".github/workflows/windows-installer.yml"
  # Packaging test only for critical updater changes; no PR release is published.
  pull_request:
    paths:
      - "apps/windows-host/Program.cs"
      - "apps/windows-host/UpdateRecoveryJournal.cs"
      - "apps/windows-host/RecoveryPackageCache.cs"
      - "apps/recovery-watch/**"
      - ".github/workflows/windows-installer.yml"
  workflow_dispatch:
    inputs:
      version:
        description: "Version for manual/test build (for example 0.2.0)"
        required: true
        default: "0.2.0"

# Automatic development releases are published only after a successful
# main-branch Windows build. PRs cannot access release write privileges.
permissions:
  contents: read

# Never interrupt a partially publishing release.
concurrency:
  group: windows-release-${{ github.ref }}
  cancel-in-progress: false

env:
  APP_VERSION: ${{ github.event_name == 'push' && format('0.2.{0}', github.run_number) || inputs.version || '0.2.0' }}

jobs:
  windows-installer:
    runs-on: windows-2022
    timeout-minutes: 35
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-dotnet@v4
        with:
          dotnet-version: '10.0.x'
      - name: Restore NuGet cache
        uses: actions/cache@v4
        with:
          path: ~/.nuget/packages
          key: nuget-${{ runner.os }}-${{ hashFiles('**/*.csproj', '**/*.props', '**/*.targets', '**/NuGet.Config', 'global.json') }}
          restore-keys: |
            nuget-${{ runner.os }}-
      - uses: actions/setup-node@v4
        with:
          node-version: '24'
          cache: npm
          cache-dependency-path: apps/web/package-lock.json
      - name: Build production web dashboard
        shell: pwsh
        working-directory: apps/web
        run: |
          npm ci --no-audit --no-fund
          if ($LASTEXITCODE -ne 0) { throw "npm ci failed" }
          npm run build
          if ($LASTEXITCODE -ne 0) { throw "frontend build failed" }

      - name: Publish self-contained Windows bridge and tray
        shell: pwsh
        run: |
          $ErrorActionPreference = 'Stop'
          if ($env:APP_VERSION -notmatch '^\d+\.\d+\.\d+$') { throw 'Invalid SemVer version' }
          dotnet publish apps/bridge/MsfsCompanion.Bridge.csproj -c Release -r win-x64 --self-contained true -o staging/app/bridge
          if ($LASTEXITCODE -ne 0) { throw 'Bridge publish failed' }
          dotnet publish apps/windows-host/MsfsCompanion.WindowsHost.csproj -c Release -r win-x64 --self-contained true -p:Version=$env:APP_VERSION -o staging/app
          if ($LASTEXITCODE -ne 0) { throw 'Tray host publish failed' }
          dotnet publish apps/recovery-watch/MsfsCompanion.RecoveryWatch.csproj -c Release -r win-x64 --self-contained true -p:PublishSingleFile=true -p:Version=$env:APP_VERSION -o staging/app/recovery-watch
          if ($LASTEXITCODE -ne 0) { throw 'Recovery watchdog publish failed' }
          if (!(Test-Path staging/app/recovery-watch/MsfsCompanion.RecoveryWatch.exe)) { throw 'Recovery watchdog binary missing' }
          New-Item -ItemType Directory -Force staging/app/bridge/wwwroot | Out-Null
          Copy-Item apps/web/dist/* staging/app/bridge/wwwroot/ -Recurse -Force
          if (!(Test-Path staging/app/MsfsCompanion.WindowsHost.exe)) { throw 'Tray executable missing' }
          if (!(Test-Path staging/app/bridge/MsfsCompanion.Bridge.exe)) { throw 'Bridge executable missing' }
          if (!(Test-Path staging/app/bridge/wwwroot/index.html)) { throw 'Frontend missing' }
          # Ověření identity produktu pro Správce úloh a ikony ve Windows.
          $exeInfo = (Get-Item staging/app/MsfsCompanion.WindowsHost.exe).VersionInfo
          $bridgeInfo = (Get-Item staging/app/bridge/MsfsCompanion.Bridge.exe).VersionInfo
          Write-Host "Windows host: $($exeInfo.FileDescription) | $($exeInfo.ProductName)"
          Write-Host "Windows bridge: $($bridgeInfo.FileDescription) | $($bridgeInfo.ProductName)"
          if ($exeInfo.FileDescription -notlike '*MSFS Companion*') { throw 'Missing Windows host file description' }
          if ($bridgeInfo.FileDescription -notlike '*MSFS Companion*') { throw 'Missing Windows bridge file description' }
          Add-Type -AssemblyName System.Drawing
          $appIcon = [System.Drawing.Icon]::ExtractAssociatedIcon((Resolve-Path staging/app/MsfsCompanion.WindowsHost.exe).Path)
          if ($null -eq $appIcon) { throw 'Windows executable is missing its icon' }
          $appIcon.Dispose()

      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'

      - name: Download official MSFS 2020 SDK Core 0.24.5
        shell: pwsh
        run: |
          $ErrorActionPreference = 'Stop'
          $url = 'https://sdk.flightsimulator.com/files/installers/0.24.5/MSFS_SDK_Core_Installer_0.24.5.msi'
          $installer = Join-Path $env:RUNNER_TEMP 'msfs-2020-sdk.msi'
          Invoke-WebRequest -Uri $url -OutFile $installer -MaximumRedirection 4
          if (!(Test-Path $installer) -or (Get-Item $installer).Length -lt 1048576) {
            throw 'Official SDK download missing or unexpectedly small.'
          }
          Write-Host "Downloaded SDK Core: $([math]::Round((Get-Item $installer).Length/1MB,1)) MiB"

      - name: Install SDK platform toolset
        shell: pwsh
        run: |
          $ErrorActionPreference = 'Stop'
          $installer = Join-Path $env:RUNNER_TEMP 'msfs-2020-sdk.msi'
          $log = Join-Path $env:RUNNER_TEMP 'msfs-sdk-install.log'
          $process = Start-Process -FilePath 'msiexec.exe' -ArgumentList @(
            '/i', ('"' + $installer + '"'), '/qn', '/norestart', '/L*v',
            ('"' + $log + '"')
          ) -Wait -PassThru
          if ($process.ExitCode -notin @(0,3010)) {
            if (Test-Path $log) { Get-Content $log -Tail 65 }
            throw "Official MSFS SDK install failed with exit $($process.ExitCode)"
          }
          Write-Host "Official MSFS 2020 SDK installed (exit $($process.ExitCode))"

      - name: Build with actual MSFS platform toolset (not mocks)
        shell: pwsh
        run: |
          $ErrorActionPreference = 'Stop'
          $vswhere = Join-Path ${env:ProgramFiles(x86)} 'Microsoft Visual Studio/Installer/vswhere.exe'
          if (!(Test-Path $vswhere)) { throw 'vswhere.exe missing on Windows runner' }
          $vsPath = & $vswhere -latest -products '*' -property installationPath
          if (!$vsPath) { throw 'Visual Studio installation not found' }
          $msbuild = Join-Path $vsPath 'MSBuild/Current/Bin/MSBuild.exe'
          if (!(Test-Path $msbuild)) { throw "MSBuild missing: $msbuild" }
          # MSFS 2020 MSI registers the platform, but fresh CI runners do
          # not always inherit the SDK root in the parent shell.
          $sdkRoot = $env:MSFS_SDK
          if (!$sdkRoot -or !(Test-Path (Join-Path $sdkRoot 'WASM/vs/2022/Microsoft.Cpp.MSFS.Common.props'))) {
            $sdkRoot = 'C:\MSFS SDK'
          }
          if (!(Test-Path (Join-Path $sdkRoot 'WASM/vs/2022/Microsoft.Cpp.MSFS.Common.props'))) {
            Write-Host 'Looking for installed WASM toolset directories:'
            Get-ChildItem 'C:\' -Directory | Where-Object { $_.Name -like '*MSFS*' } |
              ForEach-Object { Write-Host $_.FullName }
            throw "WASM toolset missing below ${sdkRoot}: SDK installation layout changed"
          }
          if (!$sdkRoot.EndsWith('\')) { $sdkRoot += '\' }
          $env:MSFS_SDK = $sdkRoot
          Write-Host "SDK root = $sdkRoot"
          & $msbuild apps/a320-wasm/KokpitA320Module.vcxproj /m /v:minimal /p:Configuration=Release /p:Platform=MSFS "/p:ToolsetRoot=$sdkRoot"
          if ($LASTEXITCODE -ne 0) { throw "MSFS SDK WASM compile failed ($LASTEXITCODE)" }
          $wasm = 'apps/a320-wasm/build/Release/kokpit-a320.wasm'
          if (!(Test-Path $wasm)) { throw "No actual SDK-generated WASM at $wasm" }
          $bytes = [System.IO.File]::ReadAllBytes((Resolve-Path $wasm).Path)
          if ($bytes.Length -lt 4096 -or $bytes[0] -ne 0 -or $bytes[1] -ne 97 -or
              $bytes[2] -ne 115 -or $bytes[3] -ne 109) {
            throw 'Compiler did not produce a valid-sized WebAssembly binary.'
          }
          Write-Host "MSFS2020 WASM built: $($bytes.Length) bytes"

      - name: Bundle verified A320 WASM Community package inside Windows installer
        shell: pwsh
        run: |
          $ErrorActionPreference = 'Stop'
          python scripts/package-a320-wasm.py apps/a320-wasm/build/Release/kokpit-a320.wasm staging/app/a320-module
          if ($LASTEXITCODE -ne 0) { throw 'WASM package script failed' }
          $folder = 'staging/app/a320-module/kokpit-asobo-a320-v1'
          if (!(Test-Path "$folder/manifest.json") -or !(Test-Path "$folder/layout.json") -or
              !(Test-Path "$folder/modules/kokpit-a320.wasm")) { throw 'Bundled WASM module incomplete' }
          $size = (Get-Item "$folder/modules/kokpit-a320.wasm").Length
          if ($size -lt 4096) { throw 'Bundled WASM module unexpectedly small' }
          Write-Host "Kokpit includes Community WASM module ($size bytes)."

      - name: Smoke test packaged HTTP API and React dashboard
        shell: pwsh
        run: |
          $ErrorActionPreference = 'Stop'
          $exe = (Resolve-Path staging/app/bridge/MsfsCompanion.Bridge.exe).Path
          $workDir = (Resolve-Path staging/app/bridge).Path
          # Ověřujeme správu jen z domácího webového dashboardu bez klíče.
          # Požadavky z cizích originů musí být odmítnuté.
          $env:MSFS_COMPANION_CONTROL_DIR = Join-Path $env:RUNNER_TEMP 'companion-test-control'
          $env:MSFS_COMPANION_RECORDINGS_DIR = Join-Path $env:RUNNER_TEMP 'companion-test-flights'
          New-Item -ItemType Directory -Force $env:MSFS_COMPANION_CONTROL_DIR | Out-Null
          # Nastavení mDNS hostitele v bridge bez nutnosti multicastu na CI.
          $env:MSFS_COMPANION_MDNS_NAME = "letadlo-2.local"
          $bridgeProcess = Start-Process -FilePath $exe -WorkingDirectory $workDir -PassThru -WindowStyle Hidden
          try {
            $ready = $false
            for ($i = 0; $i -lt 40; $i++) {
              Start-Sleep -Milliseconds 250
              try {
                $status = Invoke-RestMethod -Uri "http://127.0.0.1:8765/api/status" -TimeoutSec 2
                if ($status.status -eq 'ok') { $ready = $true; break }
              } catch { }
            }
            if (!$ready) { throw 'Bundled Windows bridge failed to start' }
            $html = Invoke-WebRequest -Uri "http://127.0.0.1:8765/admin" -TimeoutSec 5
            if ($html.StatusCode -ne 200 -or !$html.Content.Contains("MSFS Companion")) {
              throw 'Bundled React dashboard is unavailable'
            }
            $a320Page = Invoke-WebRequest -Uri "http://127.0.0.1:8765/a320" -TimeoutSec 5
            if ($a320Page.StatusCode -ne 200) { throw 'A320 dashboard route was not packaged' }
            $airbus = Invoke-RestMethod -Uri "http://127.0.0.1:8765/api/aircraft/airbus/a320/status" -TimeoutSec 5
            if ($airbus.connected -or $null -ne $airbus.engines -or
                $null -ne $airbus.fcu -or $null -ne $airbus.aux) {
              throw 'Asobo A320 endpoint fabricated telemetry while MSFS was offline'
            }
            Start-Sleep -Milliseconds 1400
            $flights = @(Invoke-RestMethod "http://127.0.0.1:8765/api/flights" -TimeoutSec 5)
            if ($flights.Count -lt 1) { throw 'Recorder nevytvořil záznam mock letu' }
            $flight = Invoke-RestMethod "http://127.0.0.1:8765/api/flights/$($flights[0].id)" -TimeoutSec 5
            if ($flight.samples.Count -lt 1) { throw 'Historie letu neobsahuje vzorky' }
            $alias = @{ Host = 'letadlo-2.local:8765' }
            $resAlias = Invoke-RestMethod 'http://127.0.0.1:8765/api/status' -Headers $alias -TimeoutSec 5
            if ($resAlias.status -ne 'ok') { throw 'Custom mDNS Host was rejected' }
            foreach ($forbiddenHost in @('kokpit.local:8765', 'attacker.example:8765', 'bad.name.local:8765')) {
              try {
                Invoke-WebRequest 'http://127.0.0.1:8765/api/status' -Headers @{ Host = $forbiddenHost } -TimeoutSec 5 | Out-Null
                throw 'Unconfigured hostname was permitted'
              } catch {
                if ($_.Exception.Response.StatusCode.value__ -ne 403) { throw }
              }
            }
            # Změna hlavičky Host je pokus o DNS rebinding.
            $wrongHost = @{ Host = 'nepratelsky-web.example' }
            try {
              Invoke-WebRequest "http://127.0.0.1:8765/api/status" -Headers $wrongHost -TimeoutSec 5 | Out-Null
              throw 'Host spoofing was permitted'
            } catch {
              if ($_.Exception.Response.StatusCode.value__ -ne 403) { throw }
            }
            $status = Invoke-RestMethod "http://127.0.0.1:8765/api/admin/updates/status" -TimeoutSec 5
            if ($status.state -ne 'initializing') { throw 'Unexpected update state' }
            $url = 'http://127.0.0.1:8765/api/admin/updates/check'
            try {
              Invoke-WebRequest $url -Method Post -TimeoutSec 5 | Out-Null
              throw 'Cross-site form was permitted'
            } catch {
              if ($_.Exception.Response.StatusCode.value__ -ne 403) { throw }
            }
            $invalid = @{ Origin = 'http://cizi-web.example'; 'X-MSFS-Companion-Action' = 'check-update' }
            try {
              Invoke-WebRequest $url -Headers $invalid -Method Post -TimeoutSec 5 | Out-Null
              throw 'Foreign Origin was permitted'
            } catch {
              if ($_.Exception.Response.StatusCode.value__ -ne 403) { throw }
            }
            $headers = @{ Origin = 'http://127.0.0.1:8765'; 'X-MSFS-Companion-Action' = 'check-update' }
            $res = Invoke-RestMethod $url -Headers $headers -Method Post -TimeoutSec 5
            if (!$res.accepted) { throw 'LAN dashboard update request rejected' }
            if (@(Get-ChildItem $env:MSFS_COMPANION_CONTROL_DIR -Filter 'request-*.json').Count -ne 1) { throw 'IPC request not created' }
            Write-Host 'Windows packaged dashboard and LAN-only CSRF protection passed'
          } finally {
            if (!$bridgeProcess.HasExited) { Stop-Process -Id $bridgeProcess.Id -Force }
            $bridgeProcess.Dispose()
            Remove-Item Env:MSFS_COMPANION_MDNS_NAME -ErrorAction SilentlyContinue
          }

      - name: Ověřit live SimConnect režim bez simulátoru
        shell: pwsh
        run: |
          $ErrorActionPreference = 'Stop'
          if (!(Test-Path staging/app/bridge/SimConnect.dll)) { throw 'Chybí SimConnect.dll v balíčku bridge' }
          $env:MSFS_COMPANION_TELEMETRY_MODE = 'simconnect'
          $env:Kestrel__Endpoints__Http__Url = 'http://127.0.0.1:8766'
          $exe = (Resolve-Path staging/app/bridge/MsfsCompanion.Bridge.exe).Path
          $workDir = (Resolve-Path staging/app/bridge).Path
          $simProcess = Start-Process -FilePath $exe -WorkingDirectory $workDir -PassThru -WindowStyle Hidden
          try {
            $ready = $false
            for ($i = 0; $i -lt 40; $i++) {
              Start-Sleep -Milliseconds 250
              try {
                $status = Invoke-RestMethod 'http://127.0.0.1:8766/api/status' -TimeoutSec 2
                if ($status.mode -eq 'simconnect') { $ready = $true; break }
              } catch { }
            }
            if (!$ready) { throw 'SimConnect bridge nedokázal nastartovat' }
            Start-Sleep -Seconds 2
            $status = Invoke-RestMethod 'http://127.0.0.1:8766/api/status' -TimeoutSec 5
            if ($status.mode -ne 'simconnect' -or $status.connected -ne $false) { throw 'SimConnect bez MSFS nesmí předstírat připojení' }
            $systems = Invoke-RestMethod 'http://127.0.0.1:8766/api/aircraft/systems' -TimeoutSec 5
            if ($systems.connected -or $null -ne $systems.systems) { throw 'Bez MSFS jsou systémové SimVars nedostupné' }
            if ($null -ne $status.lastTelemetryUtc -or $status.samplesReceived -ne 0) { throw 'SimConnect bez MSFS vrátil falešné letové vzorky' }
            $sample = Invoke-RestMethod 'http://127.0.0.1:8766/api/telemetry' -TimeoutSec 5
            if ($sample.aircraft -like '*mock*') { throw 'Windows live režim se nečekaně přepnul do mocku' }
            Write-Host 'SimConnect režim bez MSFS správně čeká; žádná falešná data'
          } finally {
            if (!$simProcess.HasExited) { Stop-Process -Id $simProcess.Id -Force }
            $simProcess.Dispose()
            Remove-Item Env:MSFS_COMPANION_TELEMETRY_MODE -ErrorAction SilentlyContinue
            Remove-Item Env:Kestrel__Endpoints__Http__Url -ErrorAction SilentlyContinue
          }

      - name: Verify safety policy without running the simulator
        shell: pwsh
        run: |
          # WinExe applications are GUI-subsystem processes. PowerShell's &
          # operator may return before they exit, leaving LASTEXITCODE stale.
          $selfTest = Start-Process -FilePath (Resolve-Path ./staging/app/MsfsCompanion.WindowsHost.exe).Path -ArgumentList '--self-test' -PassThru -Wait
          if ($selfTest.ExitCode -ne 0) { throw "Update safety policy test failed: $($selfTest.ExitCode)" }

      - name: Package Velopack installer and update feed
        shell: pwsh
        env:
          # Opt-in only: a trusted certificate/signing provider must be
          # configured in the Windows build environment by the maintainer.
          WINDOWS_SIGN_PARAMS: ${{ secrets.WINDOWS_SIGN_PARAMS }}
        run: |
          $ErrorActionPreference = 'Stop'
          dotnet tool install --global vpk --version 1.2.161
          if ($LASTEXITCODE -ne 0) { throw 'Installing vpk failed' }
          $packArgs = @(
            'pack', '--packId', 'Boym323.MsfsCompanion',
            '--packVersion', $env:APP_VERSION,
            '--packDir', 'staging/app',
            '--mainExe', 'MsfsCompanion.WindowsHost.exe',
            '--packTitle', 'MSFS Companion',
            '--icon', 'apps/windows-host/Assets/app.ico',
            '--packAuthors', 'Boym323',
            '--shortcuts', 'Startup,StartMenuRoot',
            '--channel', 'win', '--outputDir', 'staging/releases'
          )
          if (![string]::IsNullOrWhiteSpace($env:WINDOWS_SIGN_PARAMS)) {
            $packArgs += @('--signParams', $env:WINDOWS_SIGN_PARAMS)
            Write-Host 'Signed release requested.'
          } else {
            Write-Warning 'UNSIGNED DEVELOPMENT RELEASE: WINDOWS_SIGN_PARAMS is not configured.'
          }
          & vpk @packArgs
          if ($LASTEXITCODE -ne 0) { throw 'Velopack pack failed' }
          if (![string]::IsNullOrWhiteSpace($env:WINDOWS_SIGN_PARAMS)) {
            $setups = @(Get-ChildItem staging/releases -Filter '*Setup.exe')
            if ($setups.Count -eq 0) { throw 'No installer to verify signature.' }
            foreach ($setup in $setups) {
              $signature = Get-AuthenticodeSignature -FilePath $setup.FullName
              if ($signature.Status -ne 'Valid') {
                throw "Installer signature validation failed: $($signature.Status)"
              }
              Write-Host "Verified signed installer: $($setup.Name)"
            }
          }

      - name: Check bundled A320 module and opt-in default
        shell: pwsh
        run: |
          $ErrorActionPreference = 'Stop'
          $folder = 'staging/app/a320-module/kokpit-asobo-a320-v1'
          if (!(Test-Path "$folder/modules/kokpit-a320.wasm")) { throw 'Bundled MSFS module missing' }
          $module = Get-Content "$folder/manifest.json" -Raw | ConvertFrom-Json
          if ($module.title -ne 'Kokpit Asobo A320neo H-Event Module') { throw 'Unexpected WASM module identity' }
          Write-Host 'WASM Community package present in Windows staging.'

      - name: Smoke test actual silent Velopack installation and version
        shell: pwsh
        run: |
          $ErrorActionPreference = 'Stop'
          $setup = Get-ChildItem staging/releases -File -Filter '*Setup.exe' | Select-Object -First 1
          if ($null -eq $setup) { throw 'Setup.exe was not produced' }
          $installDir = Join-Path $env:RUNNER_TEMP 'msfs-companion-installed-smoke'
          if (Test-Path $installDir) { throw 'Installation test folder already exists' }
          # Velopack --silent installs without starting the regular tray.
          $installed = Start-Process -FilePath $setup.FullName -ArgumentList @(
            '--silent', '--installto', $installDir
          ) -PassThru -Wait
          if ($installed.ExitCode -ne 0) {
            throw "Velopack Setup.exe silent install failed: $($installed.ExitCode)"
          }
          $hostExe = Join-Path $installDir 'current/MsfsCompanion.WindowsHost.exe'
          $watchExe = Join-Path $installDir 'current/recovery-watch/MsfsCompanion.RecoveryWatch.exe'
          if (!(Test-Path $watchExe)) { throw 'Installed recovery supervisor is missing' }
          $watchCheck = Start-Process -FilePath $watchExe -ArgumentList '--self-test' -PassThru -Wait
          if ($watchCheck.ExitCode -ne 0) { throw 'Bundled independent watchdog self-test failed' }
          $installedProbe = Start-Process -FilePath $watchExe -ArgumentList @(
            '--check-installed-target', $env:APP_VERSION, $installDir
          ) -PassThru -Wait
          if ($installedProbe.ExitCode -ne 0) {
            throw 'C42 watchdog could not recognize the genuinely installed target version'
          }
          if (!(Test-Path $hostExe)) { throw 'Installed Windows host is missing' }
          $installedWasm = Join-Path $installDir 'current/a320-module/kokpit-asobo-a320-v1/modules/kokpit-a320.wasm'
          if (!(Test-Path $installedWasm)) { throw 'WASM module missing from real Velopack installation' }

          $correct = Start-Process -FilePath $hostExe -ArgumentList @(
            '--verify-installed-version', $env:APP_VERSION
          ) -PassThru -Wait
          if ($correct.ExitCode -ne 0) {
            $hostLog = Join-Path $env:LOCALAPPDATA 'MSFS Companion/windows-host.log'
            if (Test-Path $hostLog) {
              Write-Host 'C33 installed-version diagnostic:'
              Get-Content $hostLog -Tail 15 | Write-Host
            }
            throw "Installed version does not match $env:APP_VERSION"
          }
          $mismatch = Start-Process -FilePath $hostExe -ArgumentList @(
            '--verify-installed-version', '999.999.999'
          ) -PassThru -Wait
          if ($mismatch.ExitCode -eq 0) {
            throw 'Installed-version guard accepted an incorrect version'
          }
          $snapshot = Start-Process -FilePath $hostExe -ArgumentList @(
            '--smoke-recovery-package', $env:APP_VERSION
          ) -PassThru -Wait
          if ($snapshot.ExitCode -ne 0) {
            throw 'C42 full installed package was not capturable and SHA256-verifiable'
          }
          Write-Host "Real Windows Setup install/version check passed: $env:APP_VERSION"

      - name: Upload Windows installer artifact
        uses: actions/upload-artifact@v4
        with:
          name: MSFS-Companion-Windows-Installer
          path: staging/releases/*
          retention-days: 14
          if-no-files-found: error

  publish-update:
    name: Publish development release to GitHub Releases
    if: github.event_name == 'push' && github.ref == 'refs/heads/main'
    needs: windows-installer
    runs-on: windows-2022
    timeout-minutes: 20
    # Keep privileged publish separate from code running in PR builds.
    permissions:
      contents: write
    steps:
      - uses: actions/setup-dotnet@v4
        with:
          dotnet-version: '10.0.x'
      - uses: actions/download-artifact@v4
        with:
          name: MSFS-Companion-Windows-Installer
          path: staging/releases
      - name: Check generated Velopack release files
        shell: pwsh
        run: |
          $ErrorActionPreference = 'Stop'
          if (!(Test-Path staging/releases/releases.win.json)) { throw 'Velopack update manifest missing' }
          if (@(Get-ChildItem staging/releases -Filter '*Setup.exe').Count -lt 1) { throw 'Windows Setup.exe missing' }
          if (@(Get-ChildItem staging/releases -Filter '*.nupkg').Count -lt 1) { throw 'Velopack package missing' }
      - name: Publish update into the same public repository
        shell: pwsh
        env:
          VPK_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          $ErrorActionPreference = 'Stop'
          dotnet tool install --global vpk --version 1.2.161
          if ($LASTEXITCODE -ne 0) { throw 'Installing vpk failed' }
          vpk upload github --repoUrl https://github.com/Boym323/MSFS-Companion --outputDir staging/releases --channel win --token $env:VPK_TOKEN --publish --tag "v$env:APP_VERSION" --releaseName "MSFS Companion development $env:APP_VERSION" --targetCommitish "${{ github.sha }}"
          if ($LASTEXITCODE -ne 0) { throw 'Publishing Velopack update failed' }
