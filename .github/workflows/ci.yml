name: CI

on:
  pull_request:
  push:
    branches: [main]

jobs:
  bridge:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-dotnet@v4
        with:
          dotnet-version: '10.0.x'
      - name: Build bridge
        run: dotnet build apps/bridge/MsfsCompanion.Bridge.csproj --configuration Release --nologo
      - name: Deterministický test 30 FPS příjmu a 20 Hz publikace
        run: dotnet run --project tests/telemetry-pipeline/MsfsCompanion.TelemetryPipelineCheck.csproj --configuration Release

      - name: C1/C2 deterministické testy validace příkazů
        run: dotnet run --project tests/controls-logic/MsfsCompanion.ControlsCheck.csproj --configuration Release
      - name: C3 G1000 allowlist test
        run: dotnet run --project tests/g1000-logic/MsfsCompanion.G1000Check.csproj --configuration Release
      - name: C4 GPS navigace deterministický test
        run: dotnet run --project tests/navigation-logic/MsfsCompanion.NavigationCheck.csproj --configuration Release
      - name: Runtime smoke tests (HTTP, WebSocket, mock telemetry)
        run: |
          set -euo pipefail
          recordings_dir="$(mktemp -d)"
          MSFS_COMPANION_RECORDINGS_DIR="$recordings_dir" dotnet run --project apps/bridge --configuration Release --no-build > bridge.log 2>&1 &
          bridge_pid=$!
          trap 'kill "$bridge_pid" 2>/dev/null || true; cat bridge.log; rm -rf "$recordings_dir"' EXIT
          python3 -m unittest discover -s tests -p 'test_*.py' -v

  web:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '24'
      - name: Install dependencies
        working-directory: apps/web
        run: npm install --no-audit --no-fund
      - name: Ověření úhlových převodů a interpolace PFD
        working-directory: apps/web
        run: node --experimental-strip-types --test src/pfd/math.test.mjs src/pfd/layout.test.mjs src/map/geo.test.mjs src/map/routeMap.test.mjs src/aircraft/compatibility.test.mjs src/flights/analysis.test.mjs
      - name: Build frontend
        working-directory: apps/web
        run: npm run build
